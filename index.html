<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>That Which Lies Below</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wall" aria-hidden="true">
    <svg class="cracks" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <g class="crack-light">
        <path d="M0,120 L60,140 L95,128 L150,175 L190,170 L240,225" />
        <path d="M95,128 L110,90 L150,70" />
        <path d="M820,0 L812,40 L830,70 L815,110 L824,140" />
        <path d="M1000,560 L950,575 L925,610 L880,618 L860,660 L820,672" />
        <path d="M925,610 L935,650 L920,700" />
        <path d="M140,1000 L150,950 L130,905 L160,860 L150,820" />
        <path d="M130,905 L95,880 L70,890" />
      </g>
      <g class="crack-dark">
        <path d="M0,120 L60,140 L95,128 L150,175 L190,170 L240,225" />
        <path d="M95,128 L110,90 L150,70" />
        <path d="M820,0 L812,40 L830,70 L815,110 L824,140" />
        <path d="M1000,560 L950,575 L925,610 L880,618 L860,660 L820,672" />
        <path d="M925,610 L935,650 L920,700" />
        <path d="M140,1000 L150,950 L130,905 L160,860 L150,820" />
        <path d="M130,905 L95,880 L70,890" />
      </g>
    </svg>
  </div>

  <main class="recess">
    <div class="bezel">
      <div class="screen" id="screen">
        <nav class="screen-nav">
          <button type="button" class="tab active" data-view="terminal">Terminal</button>
          <button type="button" class="tab" data-view="map">Map</button>
        </nav>

        <section class="view terminal-view" id="terminal-view">
          <div class="output" id="output" role="log" aria-live="polite"></div>
          <form class="input-line" id="input-form" autocomplete="off">
            <span class="prompt">&gt;</span>
            <input id="input" type="text" spellcheck="false" autocapitalize="off" aria-label="Terminal input">
          </form>
        </section>

        <section class="view map-view" id="map-view" hidden>
          <canvas class="map-canvas tool-none" id="map-canvas"></canvas>

          <div class="map-toolbar">
            <div class="tool-group">
              <button type="button" class="map-btn" data-tool="pencil" data-key="A" aria-keyshortcuts="A" aria-label="Draw rooms">
                <svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg>
              </button>
              <button type="button" class="map-btn" data-tool="eraser" data-key="S" aria-keyshortcuts="S" aria-label="Erase">
                <svg viewBox="0 0 24 24"><path d="M3 15l9-9 7 7-6 6H8z"/><path d="M8 10l7 7"/><path d="M13 19h8"/></svg>
              </button>
              <button type="button" class="map-btn" data-tool="paint" data-key="D" aria-keyshortcuts="D" aria-label="Paint rooms">
                <svg viewBox="0 0 24 24"><path d="M20 3l-8 8"/><path d="M11 10l3 3"/><path d="M10 12c-3 0-5 2-5 4.5 0 1.5-1 2.5-2 3 4 1.5 9.5 0 9.5-4z"/></svg>
              </button>
              <button type="button" class="map-btn text-icon" data-tool="label" data-key="F" aria-keyshortcuts="F" aria-label="Label rooms">Aa</button>
              <button type="button" class="map-btn" data-tool="door" data-key="G" aria-keyshortcuts="G" aria-label="Place door">
                <svg viewBox="0 0 24 24"><path d="M6 21V3h12v18"/><path d="M3 21h18"/><path d="M14.5 12h.01"/></svg>
              </button>
            </div>
            <div class="tool-group">
              <button type="button" class="map-btn" id="map-center" title="Center view" aria-label="Center view">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
              </button>
              <button type="button" class="map-btn wide" id="map-clear" title="Erase all rooms">ERASE ALL</button>
            </div>
          </div>

          <div class="map-palette" id="map-palette" hidden>
            <label class="swatch custom" id="map-custom-swatch" title="Custom color">
              RGB<input type="color" id="map-custom-color" value="#3dff6e">
            </label>
          </div>

          <div class="map-hint" id="map-hint" hidden>Press R to rotate the door</div>

          <div class="compass" aria-hidden="true">
            <span class="n">N</span><span class="w">W</span><span class="e">E</span><span class="s">S</span>
          </div>

          <input class="map-label-input" id="map-label-input" type="text" maxlength="40"
                 spellcheck="false" placeholder="label (empty deletes)" hidden>

          <div class="map-confirm" id="map-confirm" hidden>
            <div class="map-confirm-box">
              <p>ERASE THE ENTIRE MAP?</p>
              <p class="dim">Are you sure? This cannot be undone.</p>
              <div class="map-confirm-actions">
                <button type="button" class="map-btn wide" id="map-confirm-yes">YES</button>
                <button type="button" class="map-btn wide" id="map-confirm-no">NO</button>
              </div>
            </div>
          </div>
        </section>

        <div class="scanlines" aria-hidden="true"></div>
        <div class="glass" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <aside class="commands" id="commands">
    <button class="commands-toggle" id="commands-toggle" type="button"
            aria-expanded="false" aria-controls="commands-panel" aria-label="Show commands">&#9664;</button>
    <div class="commands-panel" id="commands-panel">
      <h2>COMMANDS</h2>
      <ul id="commands-list"></ul>
    </div>
  </aside>

  <script src="config.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
